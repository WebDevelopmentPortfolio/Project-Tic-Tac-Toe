<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>
        <div class="introduction-to-game">
            <h2>Let's play! First to win 3 rounds in a row is the winner.</h2>
            <div class="game-options">
                <h2>Who do you want to play with?</h2>
                <div class="input-section">
                    <div class="input-group">
                        <label for="human-opponent">Another Human</label>
                        <input type="radio" id="human-opponent" name="radio-option" checked>
                    </div>
                    <div class="input-group">
                        <label for="computer-opponent">A Computer</label>
                        <input type="radio" id="computer-opponent" name="radio-option">
                    </div>
                </div>
            </div>
            <div class="button-section">
                <button id="start-game">Start Game</button>
            </div>
        </div>
        <div class="game-board-container hidden"></div>
    </div>
    
    <script type="module" src="./script.js"></script>
</body>
</html>
